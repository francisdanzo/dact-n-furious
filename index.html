<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />
  <title>Dact’n Furirous — apprends à taper en jouant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
  THESIS: Une piste de course sert de tableau de bord vivant ; on comprend, choisit et joue sans écran d'accueil passif.
  OWN-WORLD: Garage arcade bleu nuit, lignes de piste citron, corail énergique et panneaux techniques chaleureux.
  STORY: Je choisis mon parcours, je vois mon prochain objectif, puis je tape pour faire filer mon bolide.
  FIRST VIEWPORT: Barre haute compacte, grande piste à gauche, cockpit de progression à droite, CTA Lancer une course au-dessus du pli.
  FORM: Surface Operate/Experience, staging cockpit + piste, construite comme un tableau de bord jouable plutôt qu'un catalogue de cartes.
  -->
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#accueil" data-route="home" aria-label="Dact’n Furirous, accueil">
        <span class="brand-mark">⌨</span><span>Dact’n <b>Furious</b></span>
      </a>
      <nav class="main-nav" aria-label="Navigation principale">
        <button class="nav-link active" data-route="home">Accueil</button>
        <button class="nav-link" data-route="levels">Catalogue</button>
        <button class="nav-link" data-route="quests">Quêtes</button>
      </nav>
      <div class="top-actions">
        <button class="sound-button" aria-label="Activer ou désactiver le son" title="Son">♬</button>
        <button class="profile-chip" data-route="profile"><span class="avatar">Z</span><span class="profile-name">Zoé</span><span class="chevron">⌄</span></button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
