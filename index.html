<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Dact’n Furirous, le jeu de course pour apprendre à taper vite et juste." />
  <title>Dact’n Furirous — tape, accélère, maîtrise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
  THESIS: Le clavier est un moteur ; chaque bonne touche produit immédiatement vitesse, maîtrise et progression.
  OWN-WORLD: Garage arcade nocturne, asphalte bleu, signalétique citron, alertes corail et interfaces de télémétrie nettes.
  STORY: Le pilote reprend son parcours, apprend un geste, choisit un défi puis transforme sa précision en accélération.
  FIRST VIEWPORT: Navigation compacte, statut du pilote, grande piste vivante et panneau de mission avec départ immédiat.
  FORM: Cockpit éducatif Operate/Experience ; la course est le mécanisme central, les cours et défis sont ses voies d’accès.
  -->
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="Dact’n Furirous, accueil">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Dact’n <b>Furirous</b></span>
      </button>
      <nav class="main-nav" aria-label="Navigation principale">
        <button class="nav-link active" data-route="home"><span>Accueil</span></button>
        <button class="nav-link" data-route="courses"><span>Cours</span></button>
        <button class="nav-link" data-route="challenges"><span>Défis</span></button>
        <button class="nav-link" data-route="garage"><span>Garage</span></button>
      </nav>
      <div class="top-actions">
        <div class="xp-chip" title="Points d’expérience"><span aria-hidden="true">⚡</span><strong id="nav-xp">0</strong></div>
        <button class="sound-button" data-action="toggle-sound" aria-label="Activer le son" aria-pressed="false"><span aria-hidden="true">♪</span></button>
        <button class="profile-chip" data-route="profile" aria-label="Ouvrir le profil de Zoé">
          <span class="avatar">Z</span><span class="profile-name">Zoé</span>
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
